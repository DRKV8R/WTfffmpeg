<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 400px;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input[type="file"], select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .server-config {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .server-config input {
            width: 100%;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0052a3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.processing {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        .hidden {
            display: none;
        }
        .download-link {
            display: block;
            margin-top: 10px;
            padding: 10px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            text-align: center;
        }
        .download-link:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>🎬 WTfffmpeg</h2>
        <p>Create Videos Locally</p>
    </div>

    <div class="server-config">
        <label for="serverUrl">Local Server URL:</label>
        <input type="text" id="serverUrl" value="http://localhost:8080" placeholder="http://localhost:8080">
    </div>

    <form id="videoForm">
        <div class="form-group">
            <label for="imageFile">Image File:</label>
            <input type="file" id="imageFile" accept="image/*" required>
        </div>

        <div class="form-group">
            <label for="audioFile">Audio File:</label>
            <input type="file" id="audioFile" accept="audio/*" required>
        </div>

        <div class="form-group">
            <label for="resolution">Resolution:</label>
            <select id="resolution" required>
                <option value="720p" selected>720p (1280x720)</option>
                <option value="1080p">1080p (1920x1080)</option>
            </select>
        </div>

        <button type="submit" id="createBtn">🚀 Create Video</button>
    </form>

    <div id="status" class="hidden"></div>

    <script src="popup.js"></script>
</body>
</html>
